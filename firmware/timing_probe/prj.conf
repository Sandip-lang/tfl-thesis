# Core kernel settings
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# GPIO subsystem
CONFIG_GPIO=y

# Timer and counter subsystem
CONFIG_COUNTER=y

# System tick rate - 1000 Hz gives 1ms tick resolution
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Timing measurement API
CONFIG_TIMING_FUNCTIONS=y

# Clock control
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_STM32=y

# Logging subsystem
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_DEFERRED=y

# Thread analysis
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y

# Power management disabled
CONFIG_PM=n

# Compiler optimization
CONFIG_SPEED_OPTIMIZATIONS=y

# DWT cycle counter
CONFIG_CORTEX_M_DWT=y

# MPU disabled for TFL mark register writes to unmapped address
CONFIG_ARM_MPU=n

# Main stack size
CONFIG_MAIN_STACK_SIZE=4096
